[package]
name = "daytrace"
version = "0.1.0"
edition = "2024"
description = "Local-first personal activity timeline logger"
publish = false

[dependencies]
chrono = "0.4.45"
ctrlc = { version = "3.5.2", features = ["termination"] }
evdev = "0.13.2"
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
